<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEX — Law Study Workspace</title><link rel="stylesheet" href="lex-v4.css?v=4.22"></head>
<body>
<header class="site-header"><button class="mobile-menu" id="mobileMenu" aria-label="Open chapter navigation">☰</button><div class="logo">LE<em>X</em></div><nav id="courses" class="course-tabs" aria-label="Choose course"></nav><div class="header-actions"><button id="newSection" title="Add a section">+ Section</button></div></header>
<div class="content-layout">
<aside class="sidebar" id="sidebar"><input type="search" class="side-search" id="search" placeholder="Search rules, cases, topics… ( / )" aria-label="Search law"><nav id="outline" aria-label="Chapters and topics"></nav><div class="sidebar-bottom"><div class="side-caption">WORKSPACE</div><div class="side-tools"><button id="publish">☁ Publish local edits</button><button id="backup">↓ Export backup</button><button id="import">↑ Import content</button></div><div class="sync" id="sync">Loading course material…</div></div></aside>
<main class="main"><div class="reading"><div id="notice" class="notice" role="status" hidden></div><div class="crumb" id="crumb"></div><div class="page-heading"><div><h1 id="title">LEX</h1><p id="subtitle"></p></div><div class="heading-controls"><button id="editSection" hidden>Edit section</button><button id="newEntry" hidden>+ Add rule</button></div></div><div id="body"></div></div></main>
</div>
<div class="modal-overlay" id="modalOverlay" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">Edit</h2><form id="editor"><div id="editorFields"></div><div class="modal-buttons"><button type="button" class="danger" id="removeItem" hidden>Delete</button><button type="button" id="cancelEdit">Cancel</button><button type="submit" class="primary">Save locally</button><button type="button" id="closeModal">✕</button></div></form></div></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script src="lex-v4.js?v=4.22"></script>
</body></html>
